<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F4FB8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hablemos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Hablemos México</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone-first app, sticky top bar, fixed bottom tab bar, four views. Talavera cobalt + cempasúchil marigold. */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --sunk:#E9EEF7; --ink:#14213A; --muted:#5A6580; --line:#D8DFEC;
  --cobalt:#1F4FB8; --cobalt-ink:#FFFFFF; --marigold:#E99A00; --marigold-soft:#FFF1D1;
  --chile:#C2362B; --nopal:#23804F; --heat0:#E2E8F3; --heat1:#B9CBF0; --heat2:#7C9DE4; --heat3:#1F4FB8;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1322; --surface:#151D31; --sunk:#1B2540; --ink:#E7ECF7; --muted:#97A2BD; --line:#26314E;
  --cobalt:#7FA3F6; --cobalt-ink:#0D1322; --marigold:#F6B63A; --marigold-soft:#3A2E12;
  --chile:#F0705F; --nopal:#5DCB8D; --heat0:#1C2540; --heat1:#273C73; --heat2:#3F63B8; --heat3:#7FA3F6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#151D31; --sunk:#1B2540; --ink:#E7ECF7; --muted:#97A2BD; --line:#26314E;
  --cobalt:#7FA3F6; --cobalt-ink:#0D1322; --marigold:#F6B63A; --marigold-soft:#3A2E12;
  --chile:#F0705F; --nopal:#5DCB8D; --heat0:#1C2540; --heat1:#273C73; --heat2:#3F63B8; --heat3:#7FA3F6; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tile{width:30px;height:30px;flex:none;border-radius:6px;background:
  radial-gradient(circle at 50% 50%,var(--marigold) 0 18%,transparent 19%),
  radial-gradient(circle at 0 0,var(--cobalt) 0 42%,transparent 43%),radial-gradient(circle at 100% 0,var(--cobalt) 0 42%,transparent 43%),
  radial-gradient(circle at 0 100%,var(--cobalt) 0 42%,transparent 43%),radial-gradient(circle at 100% 100%,var(--cobalt) 0 42%,transparent 43%),var(--surface);
  border:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.sync{margin-left:auto;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--cobalt);color:var(--cobalt-ink);border-color:var(--cobalt)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Today */
.hero h1{font-size:clamp(30px,8vw,44px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--cobalt)}
.track{position:relative;height:10px;background:var(--sunk);border-radius:999px;margin-top:22px}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--cobalt);border-radius:999px}
.track .mark{position:absolute;top:-6px;width:2px;height:22px;background:var(--ink)}
.track-labels{position:relative;height:36px;font-size:12px;color:var(--muted)}
.track-labels span{position:absolute;top:6px;transform:translateX(-50%);white-space:nowrap;text-align:center;line-height:1.25}
.track-labels span:first-child{transform:none}
.track-labels span:last-child{transform:translateX(-100%);text-align:right}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0;padding-top:0}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface);padding:0}
.check[aria-checked="true"]{background:var(--nopal);border-color:var(--nopal);color:var(--surface)}
.check svg{width:14px;height:14px}
.plan .t{font-weight:600}
.plan .d{font-size:14px;color:var(--muted)}
.plan .go{font-size:14px;font-weight:600;color:var(--cobalt);background:none;border:0;padding:4px}
.mission{background:var(--marigold-soft);border-color:transparent}
.mission h3{font-size:20px;margin-top:4px}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--heat0);max-width:100%}
.heat i[data-l="1"]{background:var(--heat1)}.heat i[data-l="2"]{background:var(--heat2)}.heat i[data-l="3"]{background:var(--heat3)}
.heat i.today{outline:2px solid var(--marigold);outline-offset:-1px}
.levels{display:flex;gap:6px;flex-wrap:wrap}

/* Cards */
.flash{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:28px 18px;position:relative}
.flash .deck{position:absolute;top:14px;left:16px}
.flash .say{position:absolute;top:8px;right:8px}
.flash .front{font-family:var(--display);font-size:clamp(26px,7vw,36px);font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.flash .back{font-size:19px;border-top:1px dashed var(--line);padding-top:14px;width:100%;overflow-wrap:anywhere}
.flash .dir{font-size:13px;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 4px;font-weight:600;font-size:14px;line-height:1.2}
.grades button small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.grades .g0{color:var(--chile)} .grades .g3{color:var(--nopal)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px}
.iconbtn.live{background:var(--chile);border-color:var(--chile);color:#fff}
.progressline{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}

/* Chat */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;min-width:0;overflow-wrap:anywhere}
.msg.tutor{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--cobalt);color:var(--cobalt-ink);border-bottom-right-radius:4px;align-self:flex-end}
.msg .en{font-size:14px;color:var(--muted);margin-top:6px}
.msg .tools{display:flex;gap:6px;margin-top:8px}
.msg .tools button{font-size:13px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:3px 10px}
.fix{align-self:stretch;border-left:3px solid var(--marigold);background:var(--marigold-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.fix b{font-weight:600}
.vocab{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vocab button{font-size:13px;border:1px dashed var(--cobalt);color:var(--cobalt);background:none;border-radius:999px;padding:3px 10px}
.vocab button[disabled]{border-style:solid;opacity:.7}
.composer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:4}
.composer .in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);max-height:120px}
.scen{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scen button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.scen button b{font-family:var(--display);font-size:16px}
.scen button span{font-size:13px;color:var(--muted)}
.typing{color:var(--muted);font-size:14px}
.notice{font-size:14px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}

/* Route */
.phase{display:grid;grid-template-columns:56px 1fr;gap:14px}
.phase .when{font-family:var(--display);font-weight:700;font-size:13px;color:var(--muted);text-align:right;padding-top:3px;line-height:1.2}
.phase.now .when{color:var(--cobalt)}
.phase .body{border-left:2px solid var(--line);padding-left:16px;padding-bottom:22px;min-width:0}
.phase.now .body{border-left-color:var(--cobalt)}
.phase h3{font-size:20px}
.phase .cefr{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;background:var(--sunk);border-radius:6px;padding:2px 8px;margin-top:4px}
.phase.now .cefr{background:var(--cobalt);color:var(--cobalt-ink)}
.ms{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.ms li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:15px}
.ms .check{width:20px;height:20px;border-radius:6px;margin-top:2px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px}
.field input,.field select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.res{display:grid;grid-template-columns:1fr;gap:10px}
.res a{color:var(--cobalt);font-weight:600;text-decoration:none}
.res div{font-size:14px;color:var(--muted)}

/* Lesson */
.big{padding:16px;font-size:17px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps button{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px}
.steps button:hover{background:var(--sunk)}
.steps .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--sunk);color:var(--muted)}
.steps .dot svg{width:14px;height:14px}
.steps .done .dot{background:var(--nopal);color:var(--surface)}
.steps .now{border-color:var(--cobalt)}
.steps .now .dot{background:var(--cobalt);color:var(--cobalt-ink)}
.steps .nm{display:flex;flex-direction:column;min-width:0}
.steps .nm span{font-size:13px;color:var(--muted)}
.steps .mn{font-size:13px;color:var(--muted)}
.donebox{display:flex;flex-direction:column;gap:2px;background:var(--sunk);border-radius:10px;padding:12px 14px}
.donebox b{font-family:var(--display);font-size:20px;color:var(--nopal)}
.donebox span{font-size:14px;color:var(--muted)}
.lbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ltimer{margin-left:auto;font-family:var(--display);font-weight:700;font-size:18px}
.ltimer.over{color:var(--marigold)}
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.segs i{height:6px;border-radius:3px;background:var(--sunk)}
.segs i.done{background:var(--nopal)} .segs i.now{background:var(--cobalt)}

/* Reading */
.rlist{display:flex;flex-direction:column;gap:10px}
.rlist button{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-width:0}
.rlist b{font-family:var(--display);font-size:17px;min-width:0}
.rlist .meta{font-size:13px;color:var(--muted);grid-column:1}
.rlist .score{grid-row:1/3;grid-column:2;align-self:center;font-size:13px;font-weight:600;color:var(--nopal)}
.text{font-size:19px;line-height:1.7;max-width:62ch}
.text p{margin:0 0 6px}
.text .tr{font-size:15px;color:var(--muted);margin:0 0 6px;line-height:1.5}
.ptools{display:flex;gap:8px;margin-bottom:16px}
.ptools button{font-size:13px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:3px 10px}
.gw{font:inherit;background:none;border:0;padding:0;color:inherit;text-decoration:underline dotted var(--cobalt) 2px;text-underline-offset:4px;cursor:pointer}
.gw[aria-pressed="true"]{background:var(--marigold-soft);border-radius:4px}
.gloss{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.gloss b{font-family:var(--display);font-size:18px}
.gloss .sp{margin-left:auto;display:flex;gap:6px}
.gloss button{border:1px solid currentColor;background:none;color:inherit;border-radius:999px;padding:3px 10px;font-size:13px}
.q{display:flex;flex-direction:column;gap:8px;padding-block:14px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q .qt{font-weight:600}
.q .qen{font-size:14px;color:var(--muted)}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:15px}
.opt[aria-pressed="true"]{border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt)}
.opt.ok{border-color:var(--nopal);box-shadow:inset 0 0 0 1px var(--nopal);color:var(--nopal);font-weight:600}
.opt.bad{border-color:var(--chile);color:var(--chile);text-decoration:line-through}
.why{font-size:14px;color:var(--muted)}
.topics select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--cobalt)}
.badge{font-size:11px;background:var(--marigold);color:#14213A;border-radius:999px;padding:0 6px;margin-left:2px}
@media (prefers-reduced-motion:no-preference){.flash{transition:transform .15s ease}.flash.pop{transform:scale(.985)}}
</style>

<div class="wrap">
  <header class="top">
    <div class="tile" aria-hidden="true"></div>
    <div class="brand">Hablemos</div>
    <div class="sync" id="sync">Guardado local</div>
  </header>
  <main id="view"></main>
</div>
<div class="composer" id="composer" hidden>
  <div class="in">
    <button class="iconbtn" id="mic" title="Hablar en español" aria-label="Dictate in Spanish" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <textarea id="chatIn" rows="1" placeholder="Escribe en español… (or English if stuck)"></textarea>
    <button class="btn primary" id="send">Enviar</button>
  </div>
</div>
<nav class="tabs" aria-label="Sections"><div class="in" role="tablist">
  <button role="tab" data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Lección</button>
  <button role="tab" data-tab="tarjetas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg><span>Tarjetas<span class="badge num" id="dueBadge" hidden></span></span></button>
  <button role="tab" data-tab="leer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>Leer</button>
  <button role="tab" data-tab="conversar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Conversar</button>
  <button role="tab" data-tab="ruta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19c4 0 4-6 8-6s4-6 8-6"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="7" r="2"/></svg>Ruta</button>
</div></nav>

<script>
const STANDALONE = !(window.claude && window.claude.use);
const KEY_LS = "hablemos-api-key";
const getKey = () => { try{ return localStorage.getItem(KEY_LS)||""; }catch(e){ return ""; } };
const NO_AI = () => STANDALONE ? "Add your Anthropic API key in Ruta → Ajustes to use the AI tutor and new readings." : "The AI tutor isn't available in this view. Open the page signed in to claude.ai.";
const aiErr = (e, what) => !e ? `The ${what} didn't come through. Try again.`
  : e.code==="no_key" ? NO_AI()
  : e.code==="bad_key" ? "Your API key was rejected. Check it in Ruta → Ajustes."
  : e.code==="no_credit" ? "Your Anthropic account is out of credit. Add credit at console.anthropic.com."
  : e.code==="not_granted" ? "This page needs your permission to ask Claude. Allow it from the page's Permissions menu."
  : e.code==="rate_limited" ? "Too many requests right now. Wait a minute and try again."
  : `The ${what} didn't come through. Try again.`;
/* ---------- Content ---------- */
const RAW = `Sobrevivir|Hola, ¿qué tal?|Hi, how's it going?
Sobrevivir|Mucho gusto|Nice to meet you
Sobrevivir|¿Cómo te llamas?|What's your name? (informal)
Sobrevivir|Me llamo…|My name is…
Sobrevivir|Soy de…|I'm from…
Sobrevivir|Acabo de mudarme a México|I just moved to Mexico
Sobrevivir|Todavía no hablo mucho español|I don't speak much Spanish yet

/* ---------- Spaced repetition ---------- */
function queue(deck){
  const pool = allCards().filter(c=>deck==="Todas"||c.deck===deck);
  const due = pool.filter(c=>S.srs[c.id] && S.srs[c.id].due<=TODAY);
  const t = today(); const newLeft = Math.max(0, S.newPerDay - t.newSeen);
  const fresh = pool.filter(c=>!S.srs[c.id]).slice(0,newLeft);
  return due.sort((a,b)=>S.srs[a.id].due-S.srs[b.id].due).concat(fresh);
}
function grade(card, g){
  const s = S.srs[card.id] || {n:0,iv:0,ef:2.4,due:TODAY};
  const t = today();
  if(!S.srs[card.id]) t.newSeen++;
  if(g===0){ s.n=0; s.iv=0; s.ef=Math.max(1.3,s.ef-.2); s.due=TODAY; }
  else if(g===1){ s.iv=Math.max(1,Math.round(s.iv*1.2)); s.ef=Math.max(1.3,s.ef-.15); s.n++; }
  else if(g===2){ s.iv = s.n===0?1 : s.n===1?3 : Math.round(s.iv*s.ef); s.n++; }
  else { s.iv = s.n===0?4 : Math.round(Math.max(s.iv,1)*s.ef*1.3); s.ef=Math.min(3,s.ef+.15); s.n++; }
  if(g>0) s.due = TODAY + s.iv;
  S.srs[card.id]=s; t.cards++; save();
}
const ivLabel = (card,g)=>{ const s=S.srs[card.id]||{n:0,iv:0,ef:2.4}; if(g===0) return "ahora";
  const iv = g===1?Math.max(1,Math.round(s.iv*1.2)): g===2?(s.n===0?1:s.n===1?3:Math.round(s.iv*s.ef)) : (s.n===0?4:Math.round(Math.max(s.iv,1)*s.ef*1.3));
  return iv<30? iv+" d" : Math.round(iv/30)+" m"; };

  let n=0, i=TODAY; const act = k=>{const d=S.days[k]; return d && (d.cards>=10 || d.turns>=4);};
  if(!act(dayKey(i))) i--;
  while(act(dayKey(i))){ n++; i--; }
  return n;
}

/* ---------- Daily 90-minute lesson ---------- */
const STEPS = [
  {k:"cards", name:"Repaso de tarjetas", en:"Flashcard review", min:15, view:"cards", how:"Say each card out loud before you flip it, then grade yourself honestly."},
  {k:"shadow", name:"Escucha y repite", en:"Listen and repeat", min:10, view:"shadow", how:"Listen to each phrase, then repeat it right away. Copy the rhythm, not just the words. Do each one 2–3 times."},
  {k:"reads", name:"Lectura", en:"Reading", min:15, view:"leer", how:"Pick a reading. Read it once without help, then tap the underlined words, then answer the questions."},
  {k:"turns", name:"Conversación", en:"Conversation", min:25, view:"chat", how:"Aim for 12 or more messages. Write full sentences and read Lupita's corrections."},
  {k:"input", name:"Español real", en:"Real Spanish input", min:20, view:"input", how:"Watch or listen to something you mostly understand. Spanish subtitles only, never English."},
  {k:"mission", name:"Misión del día", en:"Today's mission", min:5, view:"mission", how:"Read today's real-world mission. Go do it later today."}
];
const LESSON_MIN = STEPS.reduce((a,s)=>a+s.min,0);
let lessonOpen = false;
const lesson = () => (today().lesson ||= {step:0, t:{}, shadowI:0, finished:false});
const fmt = s => { s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
const lessonMinutes = L => STEPS.reduce((a,s,i)=>a+Math.min(L.t[i]||0, s.min*60),0)/60;
const stepDone = (L,i) => !!today().done[STEPS[i].k] || i < L.step || L.finished;

function pickScenario(){
  const li = LEVELS.indexOf(S.level);
  const ok = SCENARIOS.filter(s=>LEVELS.indexOf(s.lvl) <= Math.max(0,li));
  return ok[(dayNum()-1) % ok.length].id;
}
function enterStep(i){
  const L = lesson(); L.step = i; lessonOpen = true; save();
  if(STEPS[i].view==="chat" && !chat.scenario){ chat.scenario = pickScenario(); chat.msgs=[]; render(); tutorTurn(); return; }
  if(STEPS[i].view==="cards"){ deckSel="Todas"; sessQ=null; cur=null; }
  render(); window.scrollTo(0,0);
}
function nextStep(){
  const L = lesson(), t = today();
  t.done[STEPS[L.step].k] = true;
  if(L.step >= STEPS.length-1){ L.finished = true; lessonOpen = false; save(); render(); window.scrollTo(0,0); return; }
  enterStep(L.step+1);
}
function pauseLesson(){ lessonOpen = false; save(); render(); window.scrollTo(0,0); }

setInterval(()=>{
  if(tab!=="hoy" || !lessonOpen || document.hidden) return;
  const L = lesson(); L.t[L.step] = (L.t[L.step]||0) + 1;

  if(el){ const left = STEPS[L.step].min*60 - L.t[L.step]; el.textContent = left>=0 ? fmt(left)+" restantes" : "+"+fmt(-left)+" extra"; el.classList.toggle("over", left<0); }
  if(L.t[L.step] % 20 === 0) save();
}, 1000);
document.addEventListener("visibilitychange",()=>{ if(document.hidden && lessonOpen) save(); });

function renderShadow(){
  const known = allCards().filter(c=>S.srs[c.id]);
  let pool = known.length>=10 ? known : known.concat(BASE.filter(c=>!S.srs[c.id])).slice(0,10);
  let seed = TODAY; const rnd = ()=>((seed = (seed*9301+49297)%233280)/233280);
  pool = pool.slice().sort(()=>rnd()-.5).slice(0,10);
  const L = lesson(), i = Math.min(L.shadowI||0, pool.length);
  if(i >= pool.length){
    V.innerHTML = `<div class="card flash"><div class="front">¡Muy bien!</div><p class="muted" style="margin:0">You repeated all ${pool.length} phrases. Go again if you have time left, or move on.</p>

    V.querySelector("#shAgain").onclick=()=>{ L.shadowI=0; save(); render(); };

/* Chat tutor */
const chat = {scenario:null, msgs:[], busy:false, showEn:false, err:""};
function tutorSystem(sc){
  return `You are "Lupita", a warm, funny Spanish tutor from Mexico City, role-playing to help an English speaker who just moved to Mexico become conversational in 6 months and fluent in 12.
Scenario: ${sc.t} — ${sc.d}. Stay in character as the other person in this scene (e.g. taquero, driver, landlord, friend), but you are also secretly the tutor.
Learner level: ${S.level} (CEFR). Calibrate strictly:
- A0/A1: 1–2 very short sentences, present tense, common words, end with one easy question.
- A2: 2–3 sentences, past tenses allowed, everyday vocabulary.
- B1: natural speech, some Mexican slang, mix tenses, occasional subjunctive.
- B2/C1: fully natural, fast Mexican Spanish, idioms, push for opinions and nuance.
Always use Mexican Spanish (ustedes, not vosotros; Mexican vocabulary and expressions like ¿mande?, padre, ahorita).
Always keep the conversation going with a question. If the learner writes in English, answer in Spanish and gently show how to say it.
Respond ONLY with JSON: {"reply": string (your in-character Spanish line), "translation": string (English of reply), "correction": string (the learner's last message rewritten as a natural Mexican would say it; "" if it was already natural or if this is the opening line), "tip": string (one short English explanation of the most useful fix; "" if none), "vocab": [{"es": string, "en": string}] (0–3 useful words/phrases from your reply worth memorizing at this level)}`;
}
async function tutorTurn(){
  if(!sample){ chat.err=NO_AI(); render(); return; }
  chat.busy=true; chat.err=""; render();
  const sc = SCENARIOS.find(s=>s.id===chat.scenario);
  const convo = chat.msgs.map(m=>m.role==="me"?{role:"user",content:m.text}:{role:"assistant",content:JSON.stringify({reply:m.text})});
  const input = [{role:"user",content: tutorSystem(sc) + (convo.length? "\n\nConversation so far follows." : "\n\nStart the scene with your opening line.")}];
  input.push(...convo);
  try{
    const r = await sample.json(input,{cache:false});
    const m = {role:"tutor", text:r.reply||"", en:r.translation||"", vocab:Array.isArray(r.vocab)?r.vocab.slice(0,3):[]};
    const lastMe = [...chat.msgs].reverse().find(x=>x.role==="me");
    if(lastMe && r.correction && r.correction.trim() && r.correction.trim()!==lastMe.text.trim()){ lastMe.fix=r.correction; lastMe.tip=r.tip||""; }
    chat.msgs.push(m); speak(m.text);
  }catch(e){
    chat.err = aiErr(e, "tutor's reply");
  }
  chat.busy=false; render(); scrollChat();
}
function scrollChat(){ requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight})); }
function sendChat(){
  const ta=document.getElementById("chatIn"); const v=ta.value.trim(); if(!v||chat.busy) return;
  if(dict && dict.active()) dict.stop();
  chat.msgs.push({role:"me",text:v}); ta.value=""; today().turns++; save(); tutorTurn(); scrollChat();
}

/* Reading */
const rd = {cur:null, showEn:{}, picked:{}, checked:false, sel:null, busy:false, err:"", topic:TOPICS[0]};
const allReadings = () => S.lib.concat(READINGS);
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function markText(text, gl){
  const hits=[]; let out=text;
  gl.slice().sort((a,b)=>b.w.length-a.w.length).forEach((g,gi)=>{
    if(!g.w) return;
    const re = new RegExp("(^|[^\\p{L}\\u0001-\\u0003])("+escRe(g.w)+")(?=[^\\p{L}]|$)","giu");
    out = out.replace(re,(m,pre,w)=>{ hits.push({w,gi:gl.indexOf(g)}); return pre+"\u0001"+(hits.length-1)+"\u0002"; });
  });
  return esc(out).replace(/\u0001(\d+)\u0002/g,(m,i)=>{const h=hits[+i]; return `<button class="gw" data-gi="${h.gi}" aria-pressed="${rd.sel===h.gi}">${esc(h.w)}</button>`;});
}
async function genReading(){
  if(!sample){ rd.err=NO_AI()+" The three readings below work without it."; render(); return; }
  rd.busy=true; rd.err=""; render();
  const prompt = `Write an original Spanish reading for an English speaker who lives in Mexico (Mexico City), CEFR level ${S.level}. Topic: ${rd.topic}.
About ${WORDS[S.level]} words in 2–4 short paragraphs. Use natural Mexican Spanish and vocabulary appropriate to ${S.level}${S.level==="A0"||S.level==="A1"?" (present tense and very common words, ir a + infinitive, a few simple past forms)":""}. Make it concrete and useful for daily life in Mexico; it can be a story, diary entry, message, article or dialogue.
Return ONLY JSON: {"title": string (Spanish), "kind": string (one word in Spanish, e.g. Cuento, Noticia, WhatsApp, Diálogo), "paras": [[spanishParagraph, englishTranslation], ...], "glossary": [{"w": exact word or phrase as it appears in the text, "en": short English meaning in context}] (8–14 items, the words a ${S.level} learner is least likely to know), "questions": [{"q": question in simple Spanish, "qEn": English version, "options": [4 short Spanish options], "answer": index 0-3 of correct option, "why": one short Spanish sentence quoting or citing the text}] (4 questions: 2 literal detail, 1 inference, 1 vocabulary-in-context; vary the correct index)}`;
  try{
    const r = await sample.json(prompt,{cache:false, modelTier:"default"});
    if(!r || !Array.isArray(r.paras) || !Array.isArray(r.questions)) throw {code:"shape"};
    const item = {id:"g:"+Date.now(), lvl:S.level, kind:r.kind||"Lectura", title:r.title||"Lectura", paras:r.paras.filter(p=>Array.isArray(p)), glossary:(r.glossary||[]).filter(g=>g&&g.w), questions:r.questions.filter(q=>q&&Array.isArray(q.options)).slice(0,5), topic:rd.topic};
    S.lib.unshift(item); S.lib = S.lib.slice(0,15); save();
    openReading(item.id);
  }catch(e){
    rd.err = aiErr(e, "reading");
  }
  rd.busy=false; render();
}

/* ---------- Standalone mode (GitHub Pages): browser speech + own API key ---------- */
async function callClaude(messages, effort){
  const key = getKey(); if(!key) throw {code:"no_key"};
  let r;
  try{
    r = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2026-10-21",
               "anthropic-beta":"server-side-fallback-2026-07-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-opus-5-5", max_tokens:16000, output_config:{effort}, fallbacks:"default", messages})});
  }catch(e){ throw {code:"upstream_error"}; }
  if(r.status===401 || r.status===403) throw {code:"bad_key"};
  if(r.status===429) throw {code:"rate_limited"};
  if(!r.ok){ const t = await r.text().catch(()=>""); throw {code: /credit|billing/i.test(t)?"no_credit":"upstream_error"}; }
  const j = await r.json();
  if(j.stop_reason==="refusal") throw {code:"refusal"};
  return (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
}
function makeApiSample(){
  const norm = input => typeof input==="string" ? [{role:"user",content:input}] : input;
  const f = async (input) => ({text: await callClaude(norm(input),"low"), truncated:false});
  f.json = async (input) => { const t = await callClaude(norm(input),"low"); const m = t.match(/\{[\s\S]*\}/); if(!m) throw {code:"invalid_json"}; return JSON.parse(m[0]); };
  return f;
}
function makeWebTTS(){
  if(!("speechSynthesis" in window)) return null;
  const voice = () => { const vs = speechSynthesis.getVoices(); return vs.find(v=>/^es[-_]MX/i.test(v.lang)) || vs.find(v=>/^es[-_](US|419)/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang)) || null; };
  const one = (text, rate) => new Promise((res,rej)=>{ const u = new SpeechSynthesisUtterance(text); u.lang="es-MX"; const v=voice(); if(v) u.voice=v; u.rate=rate||1; u.onend=()=>res(); u.onerror=()=>rej({code:"stopped"}); speechSynthesis.speak(u); });
  return {
    speak(text, opts={}){ speechSynthesis.cancel(); const lines = Array.isArray(text) ? text.map(l=>l.text) : [text]; return lines.reduce((p,l)=>p.then(()=>one(l, opts.rate)), Promise.resolve()); },
    stop(){ speechSynthesis.cancel(); }
  };
}
function makeWebDictation(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if(!SR) return null;
  let rec = null, state = "idle"; const fin = [], st = [];
  const set = (s, reason) => { state = s; st.forEach(h=>h({state:s, reason})); };
  return {
    start(){ return new Promise((res,rej)=>{
      rec = new SR(); rec.lang = "es-MX"; rec.continuous = true; rec.interimResults = false;
      rec.onstart = () => { set("listening"); res(); };
      rec.onresult = e => { for(let i=e.resultIndex;i<e.results.length;i++) if(e.results[i].isFinal) fin.forEach(h=>h({text:" "+e.results[i][0].transcript.trim()})); };
      rec.onerror = e => { if(e.error==="not-allowed" || e.error==="service-not-allowed") rej({code:"not_granted"}); };
      rec.onend = () => { rec = null; set("idle","stopped"); };
      set("starting"); try{ rec.start(); }catch(e){ set("idle","upstream_error"); rej({code:"upstream_error"}); }
    }); },
    stop(){ if(rec) rec.stop(); return Promise.resolve(); },
    active(){ return state!=="idle"; },
    onFinal(h){ fin.push(h); }, onState(h){ st.push(h); }, onPartial(){}
  };
}
function bootStandalone(){
  tts = makeWebTTS(); dict = makeWebDictation(); sample = getKey() ? makeApiSample() : null;
  if(dict){
    micBtn.hidden = false;

  setSync("En este dispositivo");
  render();
}
